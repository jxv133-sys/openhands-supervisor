[project]
name = "openhands-supervisor"
version = "0.1.0"
description = "Supervises an OpenHands coding agent running on a local model"
requires-python = ">=3.12"
dependencies = [
    "openhands-sdk",
    "openhands-tools",
    "openhands-workspace",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
supervisor = "supervisor.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["supervisor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
