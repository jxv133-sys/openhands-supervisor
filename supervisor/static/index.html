<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenHands Supervisor</title>
<link rel="icon" id="favicon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32' fill='none' stroke-linecap='round' stroke-linejoin='round'%3E%3Crect x='2.5' y='2.5' width='27' height='27' rx='7.5' stroke='%23b7a6ff' stroke-width='2.6'/%3E%3Cpath d='M9 10.5l5.5 5.5L9 21.5' stroke='%237cc4f2' stroke-width='3'/%3E%3Cpath d='M16.5 20.5l2.7 2.7 5.6-6.2' stroke='%235ed3a1' stroke-width='3'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Falls back to system fonts when offline. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
  /* "Spruce & lilac": a night-shift foreman's console. Spruce greens for the
     room, bone for text, lilac for your actions and the supervisor's voice,
     sky for the agent's voice; mint / coral / gold only ever mean
     passed / failed / needs you. */
  :root {
    --bg: #0e1b1d; --panel: #132427; --panel2: #183034; --border: #24403f; --line-soft: #1b3235;
    --text: #ece8dc; --dim: #8fa7a2; --faint: #557370;
    --accent: #b7a6ff; --accent2: #9d8af5; --on-accent: #17122e; --sky: #7cc4f2;
    --ok: #5ed3a1; --warn: #f2c14e; --bad: #ff7b6c; --purple: var(--accent);
    --ok-line: color-mix(in oklab, var(--ok) 38%, var(--panel)); --bad-line: color-mix(in oklab, var(--bad) 40%, var(--panel));
    --warn-line: color-mix(in oklab, var(--warn) 40%, var(--panel)); --accent-line: color-mix(in oklab, var(--accent) 38%, var(--panel));
    --sky-line: color-mix(in oklab, var(--sky) 34%, var(--panel));
    --ok-bg: color-mix(in oklab, var(--ok) 10%, var(--bg)); --bad-bg: color-mix(in oklab, var(--bad) 12%, var(--bg));
    --warn-bg: color-mix(in oklab, var(--warn) 9%, var(--bg)); --accent-bg: color-mix(in oklab, var(--accent) 14%, var(--bg));
    --sans: "Schibsted Grotesk", "Segoe UI", system-ui, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --r-lg: 14px; --r-md: 10px; --r-sm: 7px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 14px/1.5 var(--sans); font-feature-settings: "tnum" 0; -webkit-font-smoothing: antialiased; }
  button, input, textarea, select { font: inherit; color: inherit; }
  button { background: var(--panel2); border: 1px solid var(--border); border-radius: 6px;
    padding: 6px 12px; cursor: pointer; }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled { opacity: .45; cursor: default; }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 650; }
  button.danger { border-color: var(--bad-line); color: var(--bad); }
  button.small { padding: 2px 8px; font-size: 12px; }
  input, textarea, select { background: var(--bg); border: 1px solid var(--border); border-radius: 6px;
    padding: 6px 8px; width: 100%; }
  input:focus, textarea:focus, select:focus { outline: none; border-color: var(--accent); }
  textarea { resize: vertical; }
  .mono { font-family: var(--mono); font-size: 12.5px; }
  .dim { color: var(--dim); }
  .row { display: flex; gap: 8px; align-items: center; }
  .grow { flex: 1; }
  .hidden { display: none !important; }

  header { height: 48px; display: flex; align-items: center; gap: 12px; padding: 0 16px;
    border-bottom: 1px solid var(--border); background: var(--panel); }
  header h1 { font-size: 15px; margin: 0; font-weight: 650; }
  .chip { font-size: 12px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--border); color: var(--dim); }
  .chip.running { color: var(--ok); border-color: var(--ok-line); }
  .chip.waiting { color: var(--warn); border-color: var(--warn-line); }
  .chip.failed { color: var(--bad); border-color: var(--bad-line); }

  .layout { display: grid; grid-template-columns: 240px 1fr; height: calc(100% - 48px); }
  aside { border-right: 1px solid var(--border); background: var(--panel); overflow-y: auto; padding: 12px; }
  aside button.new { width: 100%; margin-bottom: 12px; }
  .proj { padding: 8px 10px; border-radius: 6px; cursor: pointer; margin-bottom: 4px; border: 1px solid transparent; }
  .proj:hover { background: var(--panel2); }
  .proj.active { background: var(--panel2); border-color: var(--border); }
  .proj .name { font-weight: 600; display: flex; align-items: center; gap: 6px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); display: inline-block; }
  .dot.waiting { background: var(--warn); }
  .bar { height: 4px; background: var(--border); border-radius: 2px; margin-top: 6px; overflow: hidden; display: flex; }
  .bar .done { background: var(--ok); } .bar .skip { background: var(--warn); }

  main { overflow: hidden; display: flex; flex-direction: column; }
  .scroll { overflow-y: auto; padding: 20px 24px; }
  .welcome { max-width: 640px; margin: 60px auto; color: var(--dim); }
  .welcome h2 { color: var(--text); }

  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 14px 16px; margin-bottom: 12px; }
  label { display: block; font-size: 12px; color: var(--dim); margin: 10px 0 4px; }
  label:first-child { margin-top: 0; }

  /* minmax(0, 1fr) rows: without them a grid row grows to fit its content, the
     panels get taller than the window, and nothing inside can scroll. */
  .layout { grid-template-rows: minmax(0, 1fr); }
  main { min-height: 0; }
  .project { display: grid; grid-template-columns: minmax(340px, 2fr) minmax(420px, 3fr);
    grid-template-rows: minmax(0, 1fr); gap: 0; height: 100%; min-height: 0; }
  .project > .scroll, .feedwrap { min-height: 0; }
  .project > .scroll:first-child { border-right: 1px solid var(--border); }
  .toolbar { display: flex; gap: 8px; align-items: center; margin-bottom: 14px; flex-wrap: wrap; }
  .toolbar h2 { margin: 0 8px 0 0; font-size: 18px; }
  .unsaved { color: var(--warn); font-size: 12px; }

  .ms { position: relative; }
  .ms.st-done { border-left: 3px solid var(--ok); }
  .ms.st-skipped { border-left: 3px solid var(--warn); }
  .ms.st-current { border-left: 3px solid var(--accent); box-shadow: 0 0 0 1px var(--accent-line); }
  .ms .head { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .ms .num { color: var(--dim); font-weight: 600; min-width: 20px; }
  .ms .head input { flex: 1 1 240px; min-width: 0; font-weight: 600; }
  .ms .head select { width: 110px; }
  .ms .meta { font-size: 12px; color: var(--dim); margin-top: 6px; }

  .escalation { border-color: var(--warn-line); background: var(--warn-bg); }
  .escalation h3 { margin: 0 0 6px; color: var(--warn); font-size: 15px; }
  pre { white-space: pre-wrap; word-break: break-word; background: var(--bg); border: 1px solid var(--border);
    border-radius: 6px; padding: 8px; max-height: 220px; overflow: auto; margin: 6px 0; }

  .feedwrap { display: flex; flex-direction: column; height: 100%; }
  .feedhead { padding: 12px 24px; border-bottom: 1px solid var(--border); display: flex; gap: 12px; align-items: center; }
  .feedhead h3 { margin: 0; font-size: 14px; }
  .feedhead label { margin: 0; display: flex; align-items: center; gap: 6px; font-size: 12px; }
  .feedhead input { width: auto; }
  #feed { padding: 12px 24px; font-size: 13px; }
  .ev { padding: 3px 0; border-bottom: 1px dashed var(--line-soft); white-space: pre-wrap; word-break: break-word; }
  .ev .t { color: var(--dim); font-family: var(--mono); font-size: 11px; margin-right: 8px; }
  .ev.say .who { color: var(--purple); font-weight: 600; margin-right: 6px; }
  .ev.agent { color: var(--dim); font-family: var(--mono); font-size: 12px; border-bottom: none; padding: 1px 0 1px 14px; }
  .ev.turn { color: var(--text); }
  .ev.divider { border: none; margin: 14px 0 6px; font-weight: 650; color: var(--accent); }
  .badge { font-size: 11px; padding: 1px 6px; border-radius: 4px; border: 1px solid var(--border); margin-right: 4px; }
  .badge.ok { color: var(--ok); border-color: var(--ok-line); } .badge.bad { color: var(--bad); border-color: var(--bad-line); }
  .badge.act { color: var(--accent); border-color: var(--accent-line); }
  /* right panel tabs */
  .tabs { display: flex; gap: 2px; }
  .tab { background: none; border: none; border-bottom: 2px solid transparent; border-radius: 0;
    padding: 6px 10px; color: var(--dim); font-weight: 600; }
  .tab:hover:not(:disabled) { color: var(--text); border-color: transparent; }
  .tab.on { color: var(--text); border-bottom-color: var(--accent); }
  .tab .count { font-size: 11px; background: var(--accent); color: var(--on-accent); border-radius: 999px; padding: 0 6px; margin-left: 4px; }
  .pane { flex: 1; overflow-y: auto; min-height: 0; }

  /* chat */
  #chat { padding: 12px 20px 40px; }
  .msg { margin: 8px 0; border: 1px solid var(--border); border-radius: 8px; background: var(--panel); }
  .msg > .who { font-size: 11px; font-weight: 700; letter-spacing: .03em; text-transform: uppercase; padding: 6px 10px 0; display: flex; gap: 8px; }
  .msg > .who .t { color: var(--dim); font-weight: 400; text-transform: none; font-family: var(--mono); }
  .msg > .body { padding: 4px 10px 8px; white-space: pre-wrap; word-break: break-word; }
  .msg.supervisor { border-color: var(--accent-line); } .msg.supervisor > .who { color: var(--purple); }
  .msg.agent { border-color: var(--accent-line); } .msg.agent > .who { color: var(--accent); }
  .msg.system { background: none; border-style: dashed; color: var(--dim); font-size: 12.5px; }
  .msg.system.error { color: var(--bad); border-color: var(--bad-line); }
  .msg.tool { background: var(--bg); }
  .msg.tool > .who { color: var(--dim); }
  .msg.tool .summary { font-family: var(--mono); font-size: 12.5px; padding: 4px 10px 6px; color: var(--text); word-break: break-all; }
  .msg.check.ok { border-color: var(--ok-line); } .msg.check.bad { border-color: var(--bad-line); }
  .msg.check > .who { color: var(--text); }
  .chatdiv { margin: 18px 0 6px; font-weight: 650; color: var(--accent); border-bottom: 1px solid var(--border); padding-bottom: 4px; }
  details { padding: 0 10px 6px; }
  details > summary { cursor: pointer; color: var(--dim); font-size: 12px; user-select: none; }
  details pre { max-height: 360px; }
  .clamp { max-height: 14em; overflow: hidden; position: relative; }
  .clamp::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 3em; background: linear-gradient(transparent, var(--panel)); }
  .more { font-size: 12px; color: var(--accent); cursor: pointer; padding: 0 10px 8px; }
  .filechip { font-family: var(--mono); font-size: 11.5px; border: 1px solid var(--border); border-radius: 4px; padding: 0 5px; margin: 2px 4px 2px 0; display: inline-block; cursor: pointer; color: var(--accent); }
  .filechip:hover { border-color: var(--accent); }

  /* files */
  .files { display: grid; grid-template-columns: minmax(180px, 32%) 1fr; grid-template-rows: minmax(0, 1fr); height: 100%; min-height: 0; }
  main > .scroll { flex: 1; min-height: 0; }
  .filelist { border-right: 1px solid var(--border); overflow-y: auto; padding: 8px 0; font-family: var(--mono); font-size: 12.5px; }
  .filelist .f { padding: 2px 10px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; gap: 6px; align-items: center; }
  .filelist .f:hover { background: var(--panel2); }
  .filelist .f.on { background: var(--accent-bg); }
  .filelist .d { color: var(--dim); padding: 6px 10px 2px; white-space: nowrap; }
  .filelist .new { width: 6px; height: 6px; border-radius: 50%; background: var(--ok); flex: none; }
  .filelist .new.old { background: var(--border); }
  .viewer { overflow: auto; min-width: 0; }
  .viewer .vh { position: sticky; top: 0; background: var(--panel); border-bottom: 1px solid var(--border); padding: 8px 12px; font-family: var(--mono); font-size: 12.5px; display: flex; gap: 10px; }
  .code { margin: 0; border: none; border-radius: 0; max-height: none; padding: 8px 0; counter-reset: ln; font-family: var(--mono); font-size: 12.5px; background: none; }
  .code span.l { display: block; padding: 0 12px 0 0; white-space: pre; }
  .code span.l::before { counter-increment: ln; content: counter(ln); display: inline-block; width: 3.2em; padding-right: 1em; text-align: right; color: var(--faint); user-select: none; }

  .toast { position: fixed; bottom: 16px; right: 16px; background: var(--bad-bg); border: 1px solid var(--bad-line); color: var(--text);
    padding: 10px 14px; border-radius: 8px; max-width: 420px; z-index: 30; box-shadow: 0 6px 24px #0008; }
  .toast.ok { background: var(--ok-bg); border-color: var(--ok-line); color: var(--text); }
  .chip.offline { color: var(--bad); border-color: var(--bad-line); }
  .runline { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12.5px; color: var(--dim); margin: -6px 0 12px; }
  .runline b { color: var(--text); font-weight: 600; }
  .ms .toggle { background: none; border: none; padding: 0 2px; color: var(--dim); width: 18px; }
  .ms.collapsed .body, .ms.collapsed .head select, .ms.collapsed .head button:not(.toggle) { display: none; }
  .ms.collapsed .head input { background: none; border-color: transparent; }
  .ms.collapsed { padding-top: 8px; padding-bottom: 8px; }
  .ms .stag { font-size: 11px; border-radius: 4px; padding: 0 6px; border: 1px solid var(--border); }
  .ms .stag.done { color: var(--ok); border-color: var(--ok-line); } .ms .stag.skipped { color: var(--warn); border-color: var(--warn-line); }
  .msbar { display: flex; gap: 8px; align-items: center; margin: 4px 0 10px; font-size: 12px; }
  .jump { position: absolute; right: 24px; bottom: 16px; z-index: 5; box-shadow: 0 4px 16px #0009; }
  .feedwrap { position: relative; }
  .kbd { font-family: var(--mono); font-size: 11px; border: 1px solid var(--border); border-radius: 3px; padding: 0 4px; color: var(--dim); }
  #menubtn { display: none; padding: 2px 9px; }

  /* stats (single series = --series-1; status colors always come with a glyph) */
  :root { --series-1: #3987e5; --good: var(--ok); --warning: var(--warn); --critical: var(--bad); --grid: var(--line-soft); }
  #stats { padding: 16px 20px 40px; }
  .kpis { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; margin-bottom: 18px; }
  .tile { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; min-width: 0; }
  .tile .k { font-size: 11.5px; color: var(--dim); }
  .tile .v { font-size: 22px; font-weight: 650; margin-top: 2px; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tile .s { font-size: 11.5px; color: var(--dim); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .meter { height: 6px; border-radius: 3px; background: color-mix(in oklab, var(--series-1) 22%, var(--panel)); margin-top: 6px; overflow: hidden; }
  .meter > div { height: 100%; background: var(--series-1); border-radius: 3px; }
  .meter.hot > div { background: var(--warning); }
  .sec { margin: 22px 0 8px; display: flex; align-items: baseline; gap: 10px; }
  .sec h4 { margin: 0; font-size: 13.5px; }
  .sec .dim { font-size: 12px; }
  .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 0 24px; }
  .hb { display: grid; grid-template-columns: minmax(90px, 42%) 1fr auto; gap: 8px; align-items: center; font-size: 12.5px; padding: 3px 0; }
  .hb .lbl { overflow-wrap: anywhere; line-height: 1.3; }
  .hb .trk { height: 10px; }
  .hb .fill { height: 10px; background: var(--series-1); border-radius: 0 4px 4px 0; min-width: 2px; }
  .hb .num { color: var(--text); font-variant-numeric: tabular-nums; min-width: 2.5em; text-align: right; }
  table.mt { width: 100%; border-collapse: collapse; font-size: 12.5px; font-variant-numeric: tabular-nums; }
  table.mt th { text-align: right; color: var(--dim); font-weight: 600; font-size: 11.5px; padding: 4px 6px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  table.mt td { text-align: right; padding: 5px 6px; border-bottom: 1px solid var(--line-soft); white-space: nowrap; }
  table.mt th:nth-child(2), table.mt td:nth-child(2), table.mt th:nth-child(3), table.mt td:nth-child(3) { text-align: left; }
  table.mt td.title { white-space: normal; min-width: 120px; }
  table.mt .tbar { display: inline-block; height: 8px; background: var(--series-1); border-radius: 0 4px 4px 0; vertical-align: middle; margin-right: 6px; }
  .st-ok { color: var(--good); } .st-warn { color: var(--warning); } .st-bad { color: var(--critical); }
  .tl { position: relative; }
  .tl svg { display: block; width: 100%; overflow: visible; }
  .tl text { fill: var(--dim); font-size: 10.5px; font-family: var(--mono); }
  .tl .bar { fill: var(--series-1); }
  .tl .hit:hover + .bar, .tl .bar.hl { fill: #6da7ec; }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--dim); margin-top: 6px; }
  .legend .sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px; background: var(--series-1); vertical-align: -1px; margin-right: 5px; }
  .tip { position: absolute; pointer-events: none; z-index: 10; background: var(--bg); border: 1px solid var(--border); border-radius: 6px;
    padding: 7px 9px; font-size: 12px; max-width: 320px; box-shadow: 0 6px 20px #000a; white-space: normal; }
  .tip b { font-weight: 650; } .tip .dim { font-size: 11.5px; }

  /* final review */
  .review h3 { margin: 0; font-size: 15px; }
  .review.pass { border-color: var(--ok-line); } .review.fail, .review.regressions { border-color: var(--bad-line); }
  .rq { display: grid; grid-template-columns: 18px 1fr; gap: 2px 6px; padding: 5px 0; border-top: 1px solid var(--line-soft); font-size: 13px; }
  .rq:first-of-type { border-top: none; }
  .rq .g { font-weight: 700; text-align: center; }
  .rq details { grid-column: 2; padding: 0; }
  .rq details pre { max-height: 200px; }
  .ms .stag.review { color: var(--purple); border-color: var(--accent-line); }

  /* live: the reply being written, and what the agent is doing right now */
  #live { padding: 0 20px 40px; }
  .msg.live { border-style: dashed; border-color: var(--accent); }
  .msg.live > .who .state { color: var(--dim); font-weight: 400; text-transform: none; }
  .msg.live.acting .body::after { content: none; }
  .msg.live .lthink.shimmer { color: transparent; }
  .msg.live .body::after { content: "▍"; color: var(--accent); animation: blink 1s steps(2) infinite; margin-left: 1px; }
  .msg.live .lthink { margin: 2px 10px 4px; padding: 6px 8px; border-left: 2px solid var(--border); color: var(--dim);
    font-size: 12.5px; white-space: pre-wrap; word-break: break-word; max-height: 12em; overflow: auto; }
  .msg.live .lthink.collapsed { max-height: none; overflow: visible; border: none; padding: 0 0 0 10px; font-style: italic; }
  @keyframes blink { to { visibility: hidden; } }
  .livestatus { display: flex; gap: 8px; align-items: center; color: var(--dim); font-size: 12.5px; margin: 10px 0 0; }
  .livestatus .lbl { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .livestatus .el { font-family: var(--mono); font-size: 11.5px; margin-left: auto; flex: none; }
  #chat { padding-bottom: 8px; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---- activity animations: one per kind of work (see anim() in the script) ---- */
  .anim { display: inline-block; position: relative; width: 22px; height: 16px; flex: none; vertical-align: -3px; }
  .anim i { position: absolute; display: block; }
  /* thinking: three dots orbiting like a comet */
  .a-think i { width: 5px; height: 5px; border-radius: 50%; left: 8.5px; top: 5.5px; background: var(--accent);
    animation: orbit 1.4s cubic-bezier(.5, .15, .5, .85) infinite; }
  .a-think i:nth-child(2) { animation-delay: -.2s; opacity: .7; background: var(--purple); transform: scale(.85); }
  .a-think i:nth-child(3) { animation-delay: -.4s; opacity: .4; }
  .a-think.plan i { background: var(--purple); } .a-think.plan i:nth-child(2) { background: var(--accent); }
  @keyframes orbit { from { transform: rotate(0deg) translateX(7px); } to { transform: rotate(360deg) translateX(7px); } }
  /* running a command: a tiny terminal being typed into */
  .a-term { border: 1.5px solid var(--ok); border-radius: 3px; width: 21px; }
  .a-term::before { content: ""; position: absolute; left: 2px; top: 2px; width: 3px; height: 3px; border-right: 1.5px solid var(--ok);
    border-bottom: 1.5px solid var(--ok); transform: rotate(-45deg); }
  .a-term i, .a-doc i { height: 1.5px; left: 7px; width: 0; background: var(--ok); animation: type 2s steps(6, end) infinite; }
  .a-term i:nth-child(1) { top: 2.5px; --w: 9px; } .a-term i:nth-child(2) { top: 6.5px; left: 2px; --w: 13px; animation-delay: .5s; }
  .a-term i:nth-child(3) { top: 10.5px; left: 2px; --w: 7px; animation-delay: 1s; }
  @keyframes type { 0% { width: 0; opacity: 1; } 25% { width: var(--w); } 80% { width: var(--w); opacity: 1; } 100% { width: var(--w); opacity: 0; } }
  /* editing a file: a page with lines being written */
  .a-doc { width: 14px; margin: 0 4px; border: 1.5px solid var(--accent); border-radius: 2px 5px 2px 2px; }
  .a-doc i { background: var(--accent); left: 2px; }
  .a-doc i:nth-child(1) { top: 2.5px; --w: 7px; } .a-doc i:nth-child(2) { top: 6px; --w: 5px; animation-delay: .5s; }
  .a-doc i:nth-child(3) { top: 9.5px; --w: 7px; animation-delay: 1s; }
  /* other tools: a turning gear */
  .a-gear::before { content: "⚙"; position: absolute; inset: 0; text-align: center; line-height: 16px; font-size: 15px; color: var(--accent);
    animation: spin 2.4s linear infinite; }
  /* starting the sandbox: containers popping up in turn */
  .a-boot i { width: 5px; height: 5px; top: 8px; border-radius: 1.5px; background: var(--accent); animation: pop 1.2s ease-in-out infinite; }
  .a-boot i:nth-child(1) { left: 1px; } .a-boot i:nth-child(2) { left: 8.5px; animation-delay: .15s; } .a-boot i:nth-child(3) { left: 16px; animation-delay: .3s; }
  @keyframes pop { 0%, 60%, 100% { transform: translateY(0) scale(.8); opacity: .35; } 30% { transform: translateY(-6px) scale(1); opacity: 1; } }
  /* final review: a scan line sweeping over the work */
  .a-scan { width: 16px; margin: 0 3px; border: 1.5px solid var(--dim); border-radius: 2px; overflow: hidden; }
  .a-scan i:not(:last-child) { left: 2px; height: 1.5px; background: var(--border); }
  .a-scan i:nth-child(1) { top: 3px; width: 9px; } .a-scan i:nth-child(2) { top: 7px; width: 7px; }
  .a-scan i:last-child { left: 0; right: 0; height: 3px; background: linear-gradient(transparent, var(--ok)); box-shadow: 0 1px 4px var(--ok);
    animation: scan 1.6s ease-in-out infinite alternate; }
  @keyframes scan { from { top: -3px; } to { top: 11px; } }
  /* the supervisor deciding: a radar ping */
  .a-radar i { width: 6px; height: 6px; left: 8px; top: 5px; border-radius: 50%; background: var(--purple); }
  .a-radar i:nth-child(2), .a-radar i:nth-child(3) { background: none; border: 1.5px solid var(--purple); animation: ping 1.6s ease-out infinite; }
  .a-radar i:nth-child(3) { animation-delay: .8s; }
  @keyframes ping { from { transform: scale(.6); opacity: 1; } to { transform: scale(3); opacity: 0; } }
  /* writing a reply: typing dots */
  .a-type i { width: 4px; height: 4px; top: 8px; border-radius: 50%; background: var(--accent); animation: bounce 1s ease-in-out infinite; }
  .a-type i:nth-child(1) { left: 3px; } .a-type i:nth-child(2) { left: 9px; animation-delay: .15s; } .a-type i:nth-child(3) { left: 15px; animation-delay: .3s; }
  @keyframes bounce { 0%, 60%, 100% { transform: translateY(0); opacity: .4; } 30% { transform: translateY(-4px); opacity: 1; } }
  /* stopping: a slowly fading square */
  .a-stop i { width: 8px; height: 8px; left: 7px; top: 4px; border-radius: 2px; background: var(--bad); animation: fade 1.4s ease-in-out infinite alternate; }
  @keyframes fade { from { opacity: 1; } to { opacity: .2; } }
  /* a label with light sweeping across it */
  .shimmer { background: linear-gradient(100deg, var(--dim) 35%, var(--text) 50%, var(--dim) 65%); background-size: 250% 100%;
    -webkit-background-clip: text; background-clip: text; color: transparent; animation: shimmer 2.4s linear infinite; }
  @keyframes shimmer { from { background-position: 100% 0; } to { background-position: -150% 0; } }
  /* the sidebar's "running" dot breathes; it pings faster while waiting on you */
  .dot { position: relative; }
  .dot::after { content: ""; position: absolute; inset: 0; border-radius: 50%; background: inherit; animation: ping 2s ease-out infinite; }
  .dot.waiting::after { animation-duration: 1s; }
  @media (prefers-reduced-motion: reduce) {
    .anim *, .anim::before, .anim::after, .dot::after, .msg.live .body::after { animation: none !important; }
    .a-term i, .a-doc i { width: var(--w); }
    .shimmer { animation: none; background: none; color: var(--dim); }
  }

  /* ================= theme layer: Spruce & lilac ================= */
  header { height: 54px; gap: 14px; padding: 0 18px; background: var(--bg); border-bottom: 1px solid var(--line-soft); }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand svg { flex: none; }
  header h1 { font-size: 15.5px; font-weight: 750; letter-spacing: -.01em; }
  .layout { grid-template-columns: 264px 1fr; height: calc(100% - 54px); }
  aside { background: var(--bg); border-right: 1px solid var(--line-soft); padding: 14px 12px; }
  aside button.new { padding: 9px 12px; border-radius: var(--r-md); }
  .proj { padding: 10px 12px; border-radius: var(--r-md); margin-bottom: 2px; }
  .proj:hover { background: var(--panel); }
  .proj.active { background: var(--panel2); border-color: transparent; box-shadow: inset 3px 0 0 var(--accent); }
  .proj .name { font-weight: 650; }
  .bar { height: 3px; margin-top: 8px; gap: 2px; background: none; }
  .bar .done, .bar .skip { border-radius: 2px; } .bar::after { content: ""; flex: 1; background: var(--border); border-radius: 2px; }
  .bar .done { background: var(--ok); } .bar .skip { background: var(--warn); }
  main { background: var(--bg); }
  .project > .scroll:first-child { border-right: 1px solid var(--line-soft); }
  .scroll { padding: 22px 26px; }

  button { border-radius: var(--r-sm); background: var(--panel2); border-color: var(--border); padding: 7px 13px; font-weight: 500;
    transition: border-color .15s, background-color .15s, filter .15s; }
  button:hover:not(:disabled) { border-color: var(--accent-line); background: color-mix(in oklab, var(--panel2) 80%, var(--accent) 6%); }
  button.primary:hover:not(:disabled) { filter: brightness(1.08); border-color: var(--accent); background: var(--accent); }
  button.danger { border-color: var(--bad-line); color: var(--bad); background: transparent; }
  button.small { border-radius: 6px; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  input, textarea, select { background: var(--bg); border-color: var(--border); border-radius: var(--r-sm); padding: 8px 10px; }
  textarea.grow { resize: none; overflow: hidden; }
  .tabs .tab, .tabs .tab:hover:not(:disabled) { background: none; }
  input:focus, textarea:focus, select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in oklab, var(--accent) 22%, transparent); }
  ::placeholder { color: var(--faint); }
  label { font-size: 12.5px; font-weight: 500; margin: 12px 0 5px; }
  .card { border-radius: var(--r-lg); border-color: var(--line-soft); padding: 16px 18px; }
  .chip { border-radius: 999px; padding: 3px 10px; background: var(--panel); border-color: var(--line-soft); }
  .chip.running { color: var(--ok); border-color: var(--ok-line); } .chip.waiting { color: var(--warn); border-color: var(--warn-line); background: var(--warn-bg); }
  .mono, code, pre { font-family: var(--mono); }
  pre { border-radius: var(--r-sm); background: color-mix(in oklab, var(--bg) 70%, black 30%); border-color: var(--line-soft); }
  .toast { border-radius: var(--r-md); }
  .t, .ev .t, .msg > .who .t { font-family: var(--sans); font-variant-numeric: tabular-nums; }

  /* project header: the name, then a rail with one segment per milestone */
  .toolbar { margin-bottom: 6px; }
  .toolbar h2 { font-size: 26px; font-weight: 800; letter-spacing: -.025em; line-height: 1.1; }
  #p-progress { background: none; border: none; padding: 0; color: var(--dim); font-size: 13px; }
  .rail { display: flex; gap: 3px; margin: 4px 0 18px; }
  .rail span { flex: 1; height: 6px; border-radius: 3px; background: var(--border); min-width: 6px; }
  .rail .done { background: var(--ok); } .rail .skipped { background: var(--warn); }
  .rail .current { background: var(--accent); box-shadow: 0 0 0 2px color-mix(in oklab, var(--accent) 25%, transparent); animation: railglow 1.8s ease-in-out infinite alternate; }
  @keyframes railglow { to { box-shadow: 0 0 10px 2px color-mix(in oklab, var(--accent) 45%, transparent); } }
  .runline { margin: -10px 0 14px; align-items: center; }
  .ctx { display: inline-flex; align-items: center; gap: 6px; }
  .ctx .gauge { width: 64px; height: 5px; border-radius: 3px; background: var(--border); overflow: hidden; display: inline-block; }
  .ctx .gauge > i { display: block; height: 100%; border-radius: 3px; background: var(--sky); transition: width .4s ease; }
  .ctx.hot .gauge > i { background: var(--warn); }

  /* milestones: a vertical track with a status node per stop */
  #p-ms { position: relative; padding-left: 28px; }
  #p-ms::before { content: ""; position: absolute; left: 9px; top: 20px; bottom: 20px; width: 2px; background: var(--border); border-radius: 1px; }
  .ms { border-left: 1px solid var(--line-soft) !important; box-shadow: none; }
  .ms::before { content: ""; position: absolute; left: -25px; top: 19px; width: 12px; height: 12px; border-radius: 50%;
    background: var(--bg); border: 2px solid var(--faint); }
  .ms.st-done::before { background: var(--ok); border-color: var(--ok); }
  .ms.st-skipped::before { border-color: var(--warn); background: var(--warn-bg); }
  .ms.st-current { border-color: var(--accent-line) !important; background: color-mix(in oklab, var(--panel) 85%, var(--accent) 6%); }
  .ms.st-current::before { background: var(--accent); border-color: var(--accent); box-shadow: 0 0 0 4px color-mix(in oklab, var(--accent) 25%, transparent); }
  .ms.collapsed { background: transparent; }
  .ms.collapsed .head input { font-weight: 600; color: var(--dim); }
  .ms .num { color: var(--faint); font-variant-numeric: tabular-nums; }
  .ms .stag { border-radius: 999px; padding: 1px 8px; }
  .msbar { margin: 18px 0 10px; }

  input[type=checkbox] { accent-color: var(--accent); width: auto; }
  .escalation .row { flex-wrap: wrap; } .escalation button, .toolbar button { white-space: nowrap; }
  /* the help request: the one gold thing on screen */
  .escalation { background: var(--warn-bg); border-color: var(--warn-line); }

  /* right panel */
  .feedhead { padding: 0 20px; height: 52px; border-bottom: 1px solid var(--line-soft); }
  .tab { padding: 15px 10px 13px; font-weight: 600; font-size: 13.5px; }
  .tab.on { border-bottom-color: var(--accent); }
  .msg { border-radius: var(--r-md); border-color: var(--line-soft); background: var(--panel); }
  .msg > .who { text-transform: none; letter-spacing: 0; font-size: 12.5px; font-weight: 650; padding: 8px 12px 0; }
  .msg > .body { padding: 4px 12px 10px; }
  .msg.supervisor { box-shadow: inset 3px 0 0 var(--accent); border-color: var(--line-soft); }
  .msg.agent { box-shadow: inset 3px 0 0 var(--sky); border-color: var(--line-soft); } .msg.agent > .who { color: var(--sky); }
  .msg.live { border: 1px dashed var(--sky-line); box-shadow: inset 3px 0 0 var(--sky); }
  .msg.tool { background: color-mix(in oklab, var(--bg) 75%, black 25%); }
  .msg.tool .summary { color: var(--text); }
  .msg.check.ok { border-color: var(--ok-line); } .msg.check.bad { border-color: var(--bad-line); }
  .chatdiv { color: var(--text); font-size: 15px; font-weight: 750; letter-spacing: -.01em; border-bottom-color: var(--line-soft); margin-top: 24px; }
  .filechip { color: var(--accent); border-color: var(--line-soft); border-radius: 5px; }
  .tile { border-radius: var(--r-md); border-color: var(--line-soft); }
  .tile .v { font-weight: 750; letter-spacing: -.02em; font-size: 24px; }

  /* welcome */
  .welcome h2.display { font-size: 40px; line-height: 1.08; font-weight: 800; letter-spacing: -.03em; margin: 0 0 18px; max-width: 14ch; }
  .welcome .lede { font-size: 16px; color: var(--dim); max-width: 56ch; }
  .steps { list-style: none; padding: 0; margin: 26px 0; counter-reset: step; display: grid; gap: 14px; }
  .steps li { counter-increment: step; display: grid; grid-template-columns: 30px 1fr; gap: 2px 12px; color: var(--dim); max-width: 60ch; }
  .steps li::before { content: counter(step); grid-row: span 2; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center;
    font-weight: 700; font-size: 13px; color: var(--on-accent); background: var(--accent); }
  .steps b { color: var(--text); font-weight: 650; }

  /* new project: conversation left, goal draft right */
  .newp { display: grid; grid-template-columns: minmax(0, 1fr); gap: 24px; max-width: 1180px; align-items: start; }
  .newp.withgoal { grid-template-columns: minmax(0, 1fr) minmax(340px, 460px); }
  .newtitle { font-size: 30px; font-weight: 800; letter-spacing: -.025em; margin: 0 0 4px; }
  .lede-sm { margin: 0 0 16px; max-width: 60ch; }
  .goalcard { position: sticky; top: 0; border-color: var(--accent-line); }
  .goalcard textarea { font-size: 13.5px; line-height: 1.55; }
  .readychip { color: var(--ok); border-color: var(--ok-line); margin-left: 10px; }
  .bubble { margin: 14px 0; padding: 12px 16px 14px; border-radius: var(--r-lg); background: var(--panel); border: 1px solid var(--line-soft); }
  .bubble.assistant { box-shadow: inset 3px 0 0 var(--accent); }
  .bubble.you { background: transparent; border-style: dashed; margin-left: 48px; }
  .bubble .who { font-size: 12.5px; font-weight: 650; color: var(--accent); margin-bottom: 4px; display: flex; gap: 8px; align-items: center; }
  .bubble.you .who { color: var(--dim); }
  .bubble .note { margin: 0 0 6px; }
  .q { padding: 12px 0 4px; border-top: 1px solid var(--line-soft); }
  .q:first-of-type { border-top: none; }
  .q .qt { font-weight: 650; }
  .q .why { font-size: 12.5px; color: var(--dim); margin-top: 1px; }
  .opts { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 6px; }
  .opt { border-radius: 999px; padding: 4px 12px; font-size: 13px; background: var(--bg); }
  .opt.on { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
  .opt.on:hover:not(:disabled) { background: var(--accent); }
  .q input { font-size: 13px; }
  .qa { display: grid; grid-template-columns: minmax(0, 1fr); gap: 2px; padding: 5px 0; font-size: 13px; }
  .qa .a { color: var(--text); } .qa .a.skip { color: var(--faint); font-style: italic; }
  .qa .qq { color: var(--dim); }
  @media (max-width: 1000px) { .newp.withgoal { grid-template-columns: minmax(0, 1fr); } .goalcard { position: static; } .bubble.you { margin-left: 16px; } }

  /* report a problem */
  .report summary { cursor: pointer; list-style: none; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
  .report summary::-webkit-details-marker { display: none; }
  .report summary::before { content: "▸"; color: var(--dim); }
  .report[open] summary::before { content: "▾"; }
  .report[open] { border-color: var(--bad-line); }
  /* delete */
  button.ghost { background: transparent; border-color: transparent; color: var(--dim); }
  button.ghost:hover:not(:disabled) { color: var(--bad); border-color: var(--bad-line); background: transparent; }
  dialog { background: var(--panel); color: var(--text); border: 1px solid var(--border); border-radius: var(--r-lg); padding: 0; max-width: 480px; width: calc(100% - 32px); }
  dialog::backdrop { background: color-mix(in oklab, var(--bg) 70%, transparent); backdrop-filter: blur(2px); }
  .dlg { padding: 20px 22px; }
  .dlg h3 { margin: 0 0 12px; font-size: 18px; }
  .choice { display: grid; grid-template-columns: 20px 1fr; gap: 8px; margin: 10px 0; padding: 10px 12px; border: 1px solid var(--line-soft); border-radius: var(--r-md); color: var(--text); font-size: 13.5px; cursor: pointer; }
  .choice:has(input:checked) { border-color: var(--accent-line); background: var(--accent-bg); }
  .choice input { margin-top: 3px; }
  input[type=radio], input[type=checkbox] { width: 15px; height: 15px; padding: 0; border: none; border-radius: 0; background: none; box-shadow: none; accent-color: var(--accent); flex: none; }
  button.dangerfill { background: var(--bad); border-color: var(--bad); color: #2a0d09; font-weight: 650; }
  button.dangerfill:hover:not(:disabled) { background: var(--bad); filter: brightness(1.08); border-color: var(--bad); }

  /* ideas chat: quiet, one column of conversation */
  aside button.ideasbtn { width: 100%; margin: -4px 0 14px; background: transparent; border-color: var(--accent-line); color: var(--accent); font-weight: 600; }
  aside button.ideasbtn.on { background: var(--accent-bg); }
  .ideas { display: grid; grid-template-columns: 220px minmax(0, 1fr); height: 100%; min-height: 0; }
  .ideas-list { border-right: 1px solid var(--line-soft); padding: 14px 10px; overflow-y: auto; }
  .ideas-list #ic-new { width: 100%; margin-bottom: 10px; }
  .ic { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 4px; padding: 7px 8px; border-radius: var(--r-sm); cursor: pointer; font-size: 13px; color: var(--dim); }
  .ic:hover { background: var(--panel); color: var(--text); }
  .ic.on { background: var(--panel2); color: var(--text); }
  .ic .tt { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ic .x { visibility: hidden; padding: 0 6px; border: none; background: none; color: var(--faint); font-size: 12px; }
  .ic:hover .x { visibility: visible; } .ic .x:hover:not(:disabled) { color: var(--bad); background: none; }
  .ideas-main { display: grid; grid-template-rows: minmax(0, 1fr) auto; min-height: 0; }
  .ideas-scroll { overflow-y: auto; }
  .ideas-thread { max-width: 760px; margin: 0 auto; padding: 28px 24px 12px; }
  .ideas-compose { padding: 10px 24px 16px; }
  .composebox { max-width: 760px; margin: 0 auto; display: flex; gap: 8px; align-items: flex-end; background: var(--panel);
    border: 1px solid var(--border); border-radius: var(--r-lg); padding: 8px 8px 8px 14px; }
  .composebox:focus-within { border-color: var(--accent-line); }
  .composebox textarea { border: none; background: none; padding: 6px 0; resize: none; max-height: 220px; box-shadow: none !important; }
  .composehint { max-width: 760px; margin: 6px auto 0; font-size: 11.5px; padding-left: 4px; }
  .ihero { margin: 8vh 0 24px; }
  .ihero h2 { font-size: 34px; font-weight: 800; letter-spacing: -.025em; margin: 0 0 8px; }
  .starters { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 8px; }
  .starters button { text-align: left; padding: 10px 12px; border-radius: var(--r-md); background: var(--panel); border-color: var(--line-soft); font-weight: 400; line-height: 1.4; }
  .iu { margin: 18px 0 18px 15%; padding: 10px 14px; border-radius: var(--r-lg); background: var(--panel2); white-space: pre-wrap; word-break: break-word; }
  .ia { margin: 6px 0 18px; line-height: 1.6; }
  .ia p { margin: 0 0 10px; } .ia ul, .ia ol { margin: 0 0 10px; padding-left: 22px; } .ia li { margin: 3px 0; }
  .ia h4 { margin: 14px 0 6px; font-size: 14.5px; }
  .ia code { font-family: var(--mono); font-size: 12.5px; background: var(--panel2); padding: 1px 5px; border-radius: 4px; }
  .ia pre { max-height: none; margin: 8px 0 12px; } .ia pre code { background: none; padding: 0; }
  .ia a { color: var(--accent); }
  .ia.streaming > :last-child::after { content: "▍"; color: var(--accent); animation: blink 1s steps(2) infinite; margin-left: 1px; }
  .ithink { color: var(--dim); font-size: 12.5px; margin: 4px 0 6px; padding: 0; }
  .ithink summary { list-style: none; display: inline-flex; gap: 6px; align-items: center; cursor: pointer; }
  .ithink summary::-webkit-details-marker { display: none; }
  .ithink .tx { white-space: pre-wrap; border-left: 2px solid var(--border); padding: 4px 0 4px 10px; margin: 6px 0 0; max-height: 18em; overflow: auto; }
  .itool { display: flex; gap: 8px; align-items: center; font-size: 12.5px; color: var(--dim); margin: 4px 0; flex-wrap: wrap; }
  .itool .ok { color: var(--ok); font-weight: 700; }
  .itool details { flex-basis: 100%; padding: 0 0 0 22px; } .itool details pre { max-height: 220px; font-size: 12px; }
  .itook { font-size: 11.5px; color: var(--faint); margin: -12px 0 16px; font-variant-numeric: tabular-nums; }
  .inotice { font-size: 12.5px; color: var(--dim); font-style: italic; margin: 6px 0; } .inotice.err { color: var(--bad); font-style: normal; }
  .propose { margin: 10px 0 14px; padding: 14px 16px; border-radius: var(--r-lg); border: 1px solid var(--accent-line); background: var(--accent-bg); }
  .propose b { font-size: 15px; } .propose p { margin: 6px 0 10px; color: var(--text); }
  @media (max-width: 1000px) {
    .ideas { grid-template-columns: 1fr; grid-template-rows: auto minmax(0, 1fr); }
    .ideas-list { border-right: none; border-bottom: 1px solid var(--line-soft); display: flex; gap: 6px; overflow-x: auto; padding: 8px; }
    .ideas-list #ic-new { width: auto; margin: 0; flex: none; } #ic-chats { display: flex; gap: 6px; } .ic { white-space: nowrap; max-width: 200px; }
    .iu { margin-left: 8%; } .ideas-thread { padding: 18px 14px 8px; } .ideas-compose { padding: 8px 10px 12px; }
  }

  /* project actions menu */
  button.more { padding: 2px 10px; font-size: 15px; line-height: 1.2; background: transparent; border-color: transparent; color: var(--dim); }
  button.more:hover:not(:disabled) { color: var(--text); border-color: var(--border); background: var(--panel2); }
  .proj { position: relative; }
  .proj .more { position: absolute; right: 6px; top: 7px; visibility: hidden; }
  .proj:hover .more, .proj .more:focus-visible, .proj .more.open { visibility: visible; }
  @media (hover: none) { .proj .more { visibility: visible; } }
  .proj .cancel { position: absolute; right: 8px; top: 8px; }
  .pmenu { position: fixed; z-index: 40; min-width: 210px; padding: 5px; background: var(--panel2); border: 1px solid var(--border); border-radius: var(--r-md);
    box-shadow: 0 10px 30px #0009; }
  .pmenu button { display: block; width: 100%; text-align: left; background: none; border: none; padding: 7px 10px; border-radius: 6px; font-weight: 500; }
  .pmenu button:hover:not(:disabled) { background: var(--accent-bg); }
  .pmenu button.bad { color: var(--bad); } .pmenu button.bad:hover:not(:disabled) { background: var(--bad-bg); }
  .pmenu hr { border: none; border-top: 1px solid var(--line-soft); margin: 4px 2px; }
  .vh button { padding: 1px 9px; font-size: 12px; }

  /* terminal steps */
  .mono, pre, code, .cmd { font-variant-ligatures: none; }
  .cmdbox { padding: 2px 10px 6px; }
  pre.cmd { margin: 4px 0 2px; max-height: none; background: color-mix(in oklab, var(--bg) 60%, black 40%); border-color: var(--line-soft);
    color: var(--text); font-size: 12.5px; line-height: 1.5; white-space: pre-wrap; word-break: break-word; }
  pre.cmd .prompt { color: var(--ok); font-weight: 700; user-select: none; }
  .cmdflags { font-size: 11.5px; color: var(--dim); margin-top: 2px; }
  button.linkish { background: none; border: none; color: var(--accent); padding: 2px 0; font-size: 12px; }
  button.linkish:hover:not(:disabled) { background: none; text-decoration: underline; }
  pre.out { font-size: 12px; line-height: 1.5; }
  .exitb { margin-left: 8px; font-size: 11px; padding: 0 6px; border-radius: 999px; border: 1px solid var(--border); font-weight: 600; }
  .exitb.ok { color: var(--ok); border-color: var(--ok-line); } .exitb.bad { color: var(--bad); border-color: var(--bad-line); }
  .exitb.run { color: var(--warn); border-color: var(--warn-line); }
  details.empty > summary { cursor: default; list-style: none; } details.empty > summary::-webkit-details-marker { display: none; }

  /* model breakdown */
  .mgrid { display: grid; grid-template-columns: 130px minmax(0, 1fr); gap: 7px 14px; margin: 4px 0 0; font-size: 13px; transition: opacity .2s; }
  .mgrid.loading { opacity: .5; }
  .mgrid dt { color: var(--dim); } .mgrid dd { margin: 0; font-variant-numeric: tabular-nums; }
  .mgrid .cnote { color: var(--dim); font-size: 12.5px; }
  .capchip { display: inline-block; font-size: 11.5px; padding: 0 8px; margin: 0 4px 2px 0; border-radius: 999px; border: 1px solid var(--border); color: var(--dim); }
  .capchip.key { color: var(--ok); border-color: var(--ok-line); }
  @media (max-width: 1000px) { .mgrid { grid-template-columns: 1fr; gap: 2px; } .mgrid dd { margin-bottom: 8px; } }

  /* logo states (color isn't motion, so these apply even with reduced motion) */
  body.help .logo .lg-check { stroke: var(--warn); }

  /* ================= motion =================
     Motion marks something arriving, finishing or needing you. It never loops
     for decoration, and none of it runs with prefers-reduced-motion. */
  .tabs { position: relative; }
  .tabs .ink { position: absolute; bottom: 0; left: 0; height: 2px; width: 0; background: var(--accent); border-radius: 2px; pointer-events: none; }
  .tabs .tab.on { border-bottom-color: transparent; }
  @media (prefers-reduced-motion: no-preference) {
    .tabs .ink.ready { transition: left .28s cubic-bezier(.3,.7,.2,1), width .28s cubic-bezier(.3,.7,.2,1); }
    /* logo: the check draws in once; blinks like a cursor while a run is going; amber pulse when it needs you */
    .logo .lg-check { stroke-dasharray: 13; stroke-dashoffset: 0; }
    .logo.draw .lg-check { animation: lg-draw .7s .2s cubic-bezier(.4,0,.2,1) backwards; }
    .logo.draw .lg-prompt { animation: lg-prompt .45s cubic-bezier(.3,.7,.2,1) backwards; }
    body.run .logo .lg-check { animation: lg-cursor 1.2s ease-in-out infinite; }
    body.help .logo .lg-check { animation: lg-help 1.1s ease-in-out infinite; }
    @keyframes lg-draw { from { stroke-dashoffset: 13; } }
    @keyframes lg-prompt { from { opacity: 0; transform: translateX(-3px); } }
    @keyframes lg-cursor { 0%, 100% { opacity: 1; } 50% { opacity: .25; } }
    @keyframes lg-help { 0%, 100% { opacity: 1; } 50% { opacity: .45; } }
    /* arrivals */
    .enter { animation: rise-in .32s cubic-bezier(.2,.7,.2,1) both; }
    .viewin { animation: view-in .22s ease-out both; }
    @keyframes rise-in { from { opacity: 0; transform: translateY(8px); } }
    @keyframes view-in { from { opacity: 0; transform: translateY(4px); } }
    dialog[open] { animation: pop-in .18s cubic-bezier(.2,.8,.2,1); }
    dialog[open]::backdrop { animation: fade-in .2s ease-out; }
    .pmenu { animation: menu-in .14s cubic-bezier(.2,.8,.2,1); transform-origin: top right; }
    .toast.pop { animation: toast-in .26s cubic-bezier(.2,.8,.2,1); }
    @keyframes pop-in { from { opacity: 0; transform: translateY(6px) scale(.97); } }
    @keyframes fade-in { from { opacity: 0; } }
    @keyframes menu-in { from { opacity: 0; transform: scale(.96) translateY(-4px); } }
    @keyframes toast-in { from { opacity: 0; transform: translateY(12px); } }
    button:active:not(:disabled) { transform: translateY(1px); }
    /* the help card arrives: slides in and glows twice */
    .escalation.appear { animation: esc-in .4s cubic-bezier(.2,.8,.2,1), esc-glow 1.1s .35s ease-in-out 2; }
    @keyframes esc-in { from { opacity: 0; transform: translateY(-10px); } }
    @keyframes esc-glow { 50% { box-shadow: 0 0 0 4px color-mix(in oklab, var(--warn) 30%, transparent), 0 0 24px color-mix(in oklab, var(--warn) 25%, transparent); } }
    /* a milestone completes: its node pops with a ring, the card flashes, its rail segment fills */
    .ms.justdone::before { animation: node-pop .5s cubic-bezier(.2,1.6,.4,1); }
    .ms.justdone::after { content: ""; position: absolute; left: -27px; top: 17px; width: 16px; height: 16px; border-radius: 50%;
      border: 2px solid var(--ok); animation: ring-out .9s ease-out forwards; pointer-events: none; }
    .ms.justdone { animation: done-flash 1.2s ease-out; }
    .rail span.justdone { animation: rail-fill .7s cubic-bezier(.3,.7,.2,1); transform-origin: left; }
    @keyframes node-pop { 0% { transform: scale(.4); } 60% { transform: scale(1.35); } }
    @keyframes ring-out { from { transform: scale(.6); opacity: .9; } to { transform: scale(2.6); opacity: 0; } }
    @keyframes done-flash { 0% { border-color: var(--ok-line); background: var(--ok-bg); } }
    @keyframes rail-fill { from { transform: scaleX(0); } }
    /* the whole project is done: a light sweeps across the rail */
    .rail.celebrate span { position: relative; overflow: hidden; }
    .rail.celebrate span::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, transparent, rgba(255,255,255,.75), transparent);
      transform: translateX(-100%); animation: sweep .9s ease-in-out forwards; animation-delay: calc(var(--i) * 70ms); }
    @keyframes sweep { to { transform: translateX(100%); } }
    /* stats, the first time the tab opens: bars grow, the timeline rises */
    #stats.intro .hb .fill, #stats.intro .tbar, #stats.intro .meter > div { animation: grow-x .7s cubic-bezier(.3,.7,.2,1) both; transform-origin: left; }
    #stats.intro .tl .bar { animation: grow-y .6s cubic-bezier(.3,.7,.2,1) both; transform-box: fill-box; transform-origin: bottom; animation-delay: calc(var(--i, 0) * 6ms); }
    #stats.intro .tile { animation: rise-in .4s cubic-bezier(.2,.7,.2,1) both; animation-delay: calc(var(--i, 0) * 30ms); }
    @keyframes grow-x { from { transform: scaleX(0); } }
    @keyframes grow-y { from { transform: scaleY(0); } }
    .enter .exitb { animation: badge-in .3s .25s cubic-bezier(.2,1.4,.4,1) backwards; }
    @keyframes badge-in { from { transform: scale(.6); opacity: 0; } }
  }

  /* drafting a milestone */
  .composer { border-style: dashed; border-color: var(--accent-line); background: transparent; }
  .composer textarea { min-height: 60px; }
  .ms.drafted { border-color: var(--accent) !important; }
  .ms .drafted-note { font-size: 12px; color: var(--accent); margin-top: 6px; }
  .suggest { font-size: 11.5px; padding: 1px 8px; margin-left: 8px; }
  @media (prefers-reduced-motion: reduce) { .rail .current { animation: none; } }
  @media (max-width: 1000px) {
    #menubtn { display: inline-block; }
    .layout { grid-template-columns: 1fr; }
    /* the sidebar becomes a slide-over opened with the menu button */
    aside { display: none; position: fixed; top: 48px; left: 0; bottom: 0; width: 280px; z-index: 20; box-shadow: 4px 0 24px #000a; }
    body.menu-open aside { display: block; }
    /* stack the plan above the tabs; the whole page column scrolls */
    .project { display: block; overflow-y: auto; }
    .project > .scroll:first-child { border-right: none; border-bottom: 1px solid var(--border); overflow: visible; min-height: auto; }
    .feedwrap { height: 85vh; min-height: 0; }
    .feedhead { padding: 8px 12px; flex-wrap: wrap; }
    #stats, #chat, #feed { padding-left: 12px; padding-right: 12px; }
    .files { grid-template-columns: 1fr; grid-template-rows: 30% minmax(0, 1fr); }
    .filelist { border-right: none; border-bottom: 1px solid var(--border); }
    #model { display: none; }
  }
</style>
</head>
<body>
<header>
  <button id="menubtn" title="Projects">☰</button>
  <span class="brand">
    <!-- "Checked prompt": a terminal prompt whose cursor is a check. Done means a command passed. -->
    <svg class="logo" width="26" height="26" viewBox="0 0 32 32" fill="none" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <rect class="lg-box" x="2.5" y="2.5" width="27" height="27" rx="7.5" stroke="var(--accent)" stroke-width="2.4"/>
      <path class="lg-prompt" d="M9 10.5l5.5 5.5L9 21.5" stroke="var(--sky)" stroke-width="2.8"/>
      <path class="lg-check" d="M16.5 20.5l2.7 2.7 5.6-6.2" stroke="var(--ok)" stroke-width="2.8"/>
    </svg>
    <h1>OpenHands Supervisor</h1>
  </span>
  <span class="chip" id="model"></span>
  <span class="grow"></span>
  <span class="chip offline hidden" id="offline" title="Can't reach the supervisor; retrying">disconnected</span>
  <span class="chip" id="jobchip">idle</span>
</header>
<div class="layout">
  <aside>
    <button class="new primary" id="newbtn">+ New project</button>
    <button class="new ideasbtn" id="ideasbtn">Ideas chat</button>
    <div id="projects"></div>
  </aside>
  <main id="main"></main>
</div>
<div class="toast hidden" id="toast"></div>
<dialog id="ren-dialog">
  <form method="dialog" class="dlg">
    <h3>Rename <span id="ren-old"></span></h3>
    <label for="ren-new">New name (the folder under projects/ is renamed too)</label>
    <input id="ren-new" autocomplete="off" spellcheck="false">
    <div class="dim" id="ren-hint" style="font-size:12px;margin-top:6px">Letters, digits, '.', '_' and '-'.</div>
    <div class="row" style="margin-top:16px;justify-content:flex-end">
      <button value="cancel" formnovalidate>Cancel</button>
      <button class="primary" id="ren-go" value="go">Rename</button>
    </div>
  </form>
</dialog>
<dialog id="del-dialog">
  <form method="dialog" class="dlg">
    <h3>Delete <span id="del-name"></span>?</h3>
    <label class="choice"><input type="radio" name="del-mode" value="keep" checked>
      <span><b>Remove from the supervisor, keep the code</b><br><span class="dim">Deletes the plan, logs and stats (the .supervisor folder). The code stays in projects/<span class="del-n"></span>.</span></span></label>
    <label class="choice"><input type="radio" name="del-mode" value="all">
      <span><b>Delete the project and its code</b><br><span class="dim">Removes the whole projects/<span class="del-n"></span> folder. This can't be undone.</span></span></label>
    <div id="del-confirm" class="hidden"><label for="del-typed">Type the project name to confirm</label><input id="del-typed" autocomplete="off"></div>
    <div class="row" style="margin-top:16px;justify-content:flex-end">
      <button value="cancel" formnovalidate>Cancel</button>
      <button class="dangerfill" id="del-go" value="go">Remove from supervisor</button>
    </div>
  </form>
</dialog>

<template id="tpl-welcome">
  <div class="scroll"><div class="welcome">
    <h2 class="display">Let the agent work. Step in only when it's stuck.</h2>
    <p class="lede">OpenHands writes the code on your local model. The supervisor keeps it honest: "done" is decided by real commands, never by the model's word.</p>
    <ol class="steps">
      <li><b>Describe what to build.</b><span>Your model splits it into small milestones, each with a command that proves it works.</span></li>
      <li><b>Review the plan and press Run.</b><span>Watch it work live. Close the tab if you like; the run keeps going.</span></li>
      <li><b>Answer when it asks.</b><span>If the agent can't get a milestone to pass, you get a hint box. At the end, a final review tests the whole goal.</span></li>
    </ol>
    <p>Start with <b>+ New project</b>, or open one from the project list.</p>
  </div></div>
</template>

<template id="tpl-ideas">
  <div class="ideas">
    <div class="ideas-list">
      <button class="small" id="ic-new">+ New chat</button>
      <div id="ic-chats"></div>
    </div>
    <div class="ideas-main">
      <div class="ideas-scroll" id="ic-scroll"><div class="ideas-thread" id="ic-thread"></div></div>
      <div class="ideas-compose">
        <div class="composebox">
          <textarea id="ic-text" rows="1" placeholder="Ask for ideas, or describe what you're curious about"></textarea>
          <button class="primary" id="ic-send">Send</button>
          <button class="danger hidden" id="ic-stop">Stop</button>
        </div>
        <div class="dim composehint"><span id="ic-model"></span> · Enter to send, Shift+Enter for a new line</div>
      </div>
    </div>
  </div>
</template>

<template id="tpl-new">
  <div class="scroll"><div class="newp" id="newp">
    <div class="convo">
      <h2 class="newtitle">New project</h2>
      <p class="dim lede-sm">Describe it roughly. The assistant asks what it needs to know, then writes a goal precise enough to test.</p>
      <div class="card">
        <label for="np-goal" style="margin-top:0">What do you want to build?</label>
        <textarea id="np-goal" rows="3" placeholder="e.g. a todo app for the terminal"></textarea>
        <div class="row" style="margin-top:12px;flex-wrap:wrap">
          <button class="primary" id="ga-start" title="Ctrl+Enter">Shape it with the assistant</button>
          <button id="np-skip">Write the goal myself</button>
          <span class="grow"></span>
          <button class="small hidden" id="ga-reset">Start over</button>
        </div>
      </div>
      <div id="ga-thread"></div>
    </div>
    <div class="card goalcard hidden" id="ga-goalcard">
      <div class="row"><h3 style="margin:0">Goal</h3><span class="chip readychip hidden" id="ga-ready">ready to plan</span></div>
      <p class="dim" style="font-size:12.5px;margin:4px 0 8px">This is what the planner gets. Edit it freely; the assistant keeps your edits.</p>
      <textarea id="ga-goal" rows="14"></textarea>
      <label for="np-name">Project name (folder under projects/)</label>
      <input id="np-name" placeholder="todo-rs" autocomplete="off">
      <div class="row" style="margin-top:12px;flex-wrap:wrap">
        <button class="primary" id="np-plan">Plan milestones</button>
        <span id="np-status" class="dim"></span>
      </div>
      <p class="dim" style="font-size:12px;margin:10px 0 0">Planning is one call to your model (about 30 seconds). You review the plan before anything runs.</p>
    </div>
  </div></div>
</template>

<template id="tpl-project">
  <div class="project">
    <div class="scroll">
      <div class="toolbar">
        <h2 id="p-name"></h2>
        <span class="chip" id="p-progress"></span>
        <button class="small more" id="p-more" title="Rename, download or delete" aria-label="More actions">⋯</button>
        <span class="grow"></span>
        <span class="unsaved hidden" id="p-unsaved">unsaved changes</span>
        <button id="p-save" disabled title="Save (Ctrl+S)">Save</button>
        <button class="primary" id="p-run">Run</button>
        <button class="danger hidden" id="p-stop">Stop</button>
      </div>
      <div class="rail" id="p-rail"></div>
      <div class="runline hidden" id="p-runline"></div>
      <div id="p-jobmsg" class="card hidden"></div>
      <div id="p-review" class="card review hidden"></div>
      <div id="p-esc" class="card escalation hidden">
        <h3>The agent needs your help <span class="dim" style="font-size:12px;font-weight:400" id="esc-since"></span></h3>
        <div><b id="esc-ms"></b> <span class="dim" id="esc-reason"></span></div>
        <div id="esc-agentwrap"><label>Agent said</label><pre id="esc-agent"></pre></div>
        <label>Check output (<span class="mono" id="esc-check"></span>)</label>
        <pre class="mono" id="esc-output"></pre>
        <label>Guidance for the agent (added to this milestone's notes, then it retries fresh)</label>
        <textarea id="esc-text" rows="3" placeholder="e.g. Use serde_json::from_str, and put the tests in src/storage.rs"></textarea>
        <div class="row" style="margin-top:8px">
          <button class="primary" id="esc-retry" title="Ctrl+Enter">Retry with guidance</button>
          <button id="esc-skip">Skip milestone</button>
          <button class="danger" id="esc-stop">Stop run</button>
        </div>
      </div>
      <div class="card">
        <label>Goal</label>
        <textarea id="p-goal" rows="4"></textarea>
        <label>Setup commands (one per line; run in the sandbox before the agent starts, every run)</label>
        <textarea id="p-setup" class="mono" rows="2"></textarea>
      </div>
      <div class="msbar"><span class="dim" id="ms-count"></span><span class="grow"></span>
        <button class="small" id="ms-expand">Expand all</button><button class="small" id="ms-collapse">Collapse finished</button></div>
      <div id="p-ms"></div>
      <div class="card composer" id="p-composer">
        <label for="mc-text" style="margin-top:0">Add a milestone: describe what the agent should do next</label>
        <textarea id="mc-text" rows="2" placeholder="e.g. Add a done command that marks a task as finished, and a test for it"></textarea>
        <div class="row" style="margin-top:10px">
          <button class="primary" id="mc-draft" title="Ctrl+Enter">Draft milestone</button>
          <button id="p-add">Add blank</button>
          <span class="dim grow" id="mc-status" style="font-size:12.5px"></span>
        </div>
      </div>
      <details class="card report" id="p-report">
        <summary><b>Found a problem while testing?</b> <span class="dim">Report it and the agent fixes it.</span></summary>
        <label for="br-text">What did you do, and what went wrong?</label>
        <textarea id="br-text" rows="2" placeholder="e.g. ran todo list in an empty folder and it crashed"></textarea>
        <label for="br-logs">Error output and logs (paste everything; more is better)</label>
        <textarea id="br-logs" class="mono" rows="5" placeholder="Run it again with debug logging for more detail, e.g. RUST_LOG=debug ./todo list  or  python -m app --verbose"></textarea>
        <div class="row" style="margin-top:10px;flex-wrap:wrap">
          <button class="primary" id="br-send">Create fix milestone</button>
          <span class="dim grow" id="br-status" style="font-size:12.5px">The fix milestone's check is a new test that reproduces the problem.</span>
        </div>
      </details>
    </div>
    <div class="feedwrap">
      <div class="feedhead">
        <div class="tabs">
          <button class="tab" data-tab="chat">Chat<span class="count hidden" id="n-chat"></span></button>
          <button class="tab" data-tab="activity">Activity</button>
          <button class="tab" data-tab="files">Files<span class="count hidden" id="n-files"></span></button>
          <button class="tab" data-tab="stats">Stats</button>
          <span class="ink" aria-hidden="true"></span>
        </div>
        <span class="grow"></span>
        <label id="opt-thinking"><input type="checkbox" id="f-thinking"> thinking</label>
        <label id="opt-follow"><input type="checkbox" id="f-follow" checked> follow</label>
        <label id="opt-changed" class="hidden"><input type="checkbox" id="f-changed"> changed only</label>
      </div>
      <div class="pane" id="pane-chat"><div id="chat"></div><div id="live"></div></div>
      <div class="pane hidden" id="pane-activity"><div id="feed"></div></div>
      <div class="pane hidden" id="pane-stats"><div id="stats"></div></div>
      <button class="jump hidden" id="jump">↓ Latest</button>
      <div class="pane hidden" id="pane-files" style="overflow:hidden">
        <div class="files">
          <div class="filelist" id="filelist"></div>
          <div class="viewer" id="viewer"><div class="welcome" style="margin:40px 20px">Select a file.</div></div>
        </div>
      </div>
    </div>
  </div>
</template>

<script>
"use strict";
const $ = (sel, root = document) => root.querySelector(sel);
const el = (tag, attrs = {}, ...kids) => {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") n.className = v;
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else if (k === "text") n.textContent = v;
    else n.setAttribute(k, v);
  }
  for (const kid of kids) if (kid != null) n.append(kid);
  return n;
};

const S = {
  state: null,      // /api/state
  view: "welcome",  // welcome | new | project
  current: null,    // project name
  project: null,    // /api/projects/<name>
  draft: null,      // editable copy of contract
  dirty: false,
  lastEvent: 0,
  feedCount: 0,
  chatCount: 0,
  calls: new Map(),  // tool-call id -> chat card, so results attach under their call
  tab: "chat",
  unreadChat: 0,
  unreadFiles: 0,
  files: null,       // /api/projects/<name>/files
  openFile: null,    // {path, mtime}
  toggled: new Set(), // finished milestones the user folded/unfolded against the default
  justDone: new Set(), // milestones that completed a moment ago (they animate once)
  drafted: new Set(), // milestones the model drafted, highlighted until saved
  collapseDone: localStorage.getItem("collapseDone") !== "0",
  online: true,
};

// ---------- API ----------
async function api(method, path, body) {
  const headers = { "Content-Type": "application/json" };
  const token = localStorage.getItem("supervisorToken");
  if (token) headers["X-Token"] = token;
  const res = await fetch(path, { method, headers, body: body ? JSON.stringify(body) : undefined });
  if (res.status === 401) {
    // Only one prompt even when several requests (e.g. the event poll) fail at once.
    if (!api._asking) api._asking = Promise.resolve().then(() => {
      localStorage.removeItem("supervisorToken");
      const t = prompt(token ? "That access token was rejected. Enter WEB_TOKEN:" : "This supervisor needs its access token (WEB_TOKEN):");
      if (t) localStorage.setItem("supervisorToken", t.trim());
      api._asking = null;
      return !!t;
    });
    if (await api._asking) return api(method, path, body);
  }

// Which milestones became "done" since the last time we drew this project, so

function noteJustDone() {
  const key = S.current, done = new Set(S.draft.milestones.map((m, i) => m.status === "done" ? `${i}|${m.title}` : null).filter(Boolean));
  const before = S.doneSeen && S.doneSeen.key === key ? S.doneSeen.set : null;
  if (!before) S.justDone = new Set();  // opened another project: nothing "just" happened
  const fresh = before ? [...done].filter(k => !before.has(k)).map(k => Number(k.split("|")[0])) : [];
  S.doneSeen = { key, set: done };

  drawLogo();
  setTimeout(() => rail.classList.remove("celebrate"), 2200);
}

function renderRunline() {
  const box = $("#p-runline"); if (!box) return;
  const j = job();
  if (!j || j.project !== S.current || !j.started_at) { box.classList.add("hidden"); return; }
  const total = S.draft ? S.draft.milestones.length : 0;
  const end = j.ended_at || Date.now() / 1000;
  const parts = [];
  if (j.active && j.milestone) parts.push(["milestone", `${j.milestone}/${total}`]);
  parts.push([j.active ? "running for" : "ran for", duration(end - j.started_at)]);
  if (j.active && j.escalation && j.escalation.since) parts.push(["waiting on you", duration(Date.now() / 1000 - j.escalation.since)]);
  const nodes = parts.map(([k, v]) => el("span", {}, `${k} `, el("b", { text: v })));
  // How full the model's context is right now (prompt size of its latest call).
  const c = j.active && S.context;
  if (c && c.tokens) {
    const pct = Math.min(100, 100 * c.tokens / c.max);
    nodes.push(el("span", { class: "ctx" + (pct > 85 ? " hot" : ""),
      title: `The agent's latest prompt was ${c.tokens.toLocaleString()} tokens; OpenHands summarizes older history to stay under ${c.max.toLocaleString()} (max_input_tokens).` },
      "context ", el("b", { text: `${fmtN(c.tokens)} of ${fmtN(c.max)}` }), el("span", { class: "gauge" }, el("i", { style: `width:${pct}%` }))));
  }
  box.replaceChildren(...nodes);
  box.classList.remove("hidden");
}
setInterval(() => { if (S.view === "project" && jobActive()) { renderRunline(); if (job().escalation) $("#esc-since").textContent = `(waiting ${duration(Date.now() / 1000 - job().escalation.since)})`; } }, 1000);

// ---------- actions ----------
async function save(quiet) {
  if (S.saving || !S.dirty) return !S.dirty;
  S.saving = true; $("#p-save").disabled = true;
  const name = S.current;
  try {
    const p = await api("PUT", `/api/projects/${encodeURIComponent(name)}`, { contract: S.draft });
    if (S.current === name) { S.project = p; S.draft = structuredClone(p.contract); S.drafted = new Set(); S.saving = false; setDirty(false); renderEditor(); }
    if (!quiet) toast("Plan saved.", "ok");
    await refreshState();
    return true;
  } catch (e) { toast(e.message); return false; }
  finally { S.saving = false; if (S.view === "project") setDirty(S.dirty); }
}
async function run() {
  if (S.dirty && !(await save(true))) return;
  // Ask once so we can tell you when the agent needs help while this tab is in the background.
  if ("Notification" in window && Notification.permission === "default") Notification.requestPermission().catch(() => {});
  $("#p-run").disabled = true;
  try { await api("POST", `/api/projects/${encodeURIComponent(S.current)}/run`); await refreshState(); }
  catch (e) { toast(e.message); renderProjectChrome(); }
}
async function stop() {
  if (!confirm("Stop the run? The agent's current step finishes first; progress is saved.")) return;
  try { await api("POST", "/api/stop"); await refreshState(); } catch (e) { toast(e.message); }
}
async function answer(action) {
  const text = $("#esc-text").value;
  if (action === "guidance" && !text.trim()) { $("#esc-text").focus(); return toast("Write some guidance first."); }
  if (action === "stop" && !confirm("Stop the run? Progress is saved.")) return;
  if (action === "skip" && !confirm("Skip this milestone and move on to the next one?")) return;
  for (const id of ["#esc-retry", "#esc-skip", "#esc-stop"]) $(id).disabled = true;
  try {
    await api("POST", "/api/answer", { action, text }); $("#esc-text").value = "";
    toast(action === "guidance" ? "Guidance sent; the agent retries this milestone fresh." : action === "skip" ? "Milestone skipped." : "Stopping...", "ok");
    await refreshState();
  } catch (e) { toast(e.message); for (const id of ["#esc-retry", "#esc-skip", "#esc-stop"]) $(id).disabled = false; }
}

// ---------- activity feed ----------
const time = (ts) => (ts || "").slice(11, 19);
function addFeed(r, isLive) {
  const feed = $("#feed"); if (!feed) return;
  let node = null;
  switch (r.kind) {
    case "say":
      if (r.text && r.text.startsWith("turn ended:")) break;  // shown by the "turn" row instead
      if (r.text && r.text.startsWith("=== Milestone"))
        node = el("div", { class: "ev divider", text: r.text.replace(/^=== /, "").replace(/\s+\(check: [\s\S]*\)$/, "") });
      else node = el("div", { class: "ev say" }, el("span", { class: "t", text: time(r.ts) }), el("span", { class: "who", text: "supervisor" }), r.text || "");
      break;
    case "turn": {
      const ok = r.check_passed;
      node = el("div", { class: "ev turn" }, el("span", { class: "t", text: time(r.ts) }),
        el("span", { class: "badge", text: `turn: ${r.end}` }),
        el("span", { class: "badge", text: `${r.actions} actions · ${(r.changed || []).length} files` }),
        el("span", { class: "badge " + (ok ? "ok" : "bad"), text: ok ? "check passed" : `check failed (${r.check_exit})` }),
        el("span", { class: "badge act", text: (r.decision || "").toUpperCase() }), r.reason || "");
      if ((r.changed || []).length) node.append(el("div", { style: "margin-top:3px" }, ...r.changed.map(fileChip)));
      if (r.check_output) node.append(el("details", { style: "padding:0" }, el("summary", { text: "check output" }), el("pre", { class: "mono", text: r.check_output })));
      break;
    }
    case "review":
      node = el("div", { class: "ev say" }, el("span", { class: "t", text: time(r.ts) }), el("span", { class: "who", text: "final review" }),
        r.verdict === "error" ? `could not run: ${r.error}` : r.regressions ? `${r.regressions} milestone(s) broken again` :
        `${r.passed}/${r.passed + r.failed + r.unchecked} requirements pass` + ((r.added || []).length ? `, added ${r.added.length} milestone(s)` : ""));
      break;
    case "escalate":
      node = el("div", { class: "ev say" }, el("span", { class: "t", text: time(r.ts) }), el("span", { class: "who", text: "needs help" }), `${r.title}: ${r.reason}`);
      break;
    case "guidance":
      node = el("div", { class: "ev say" }, el("span", { class: "t", text: time(r.ts) }), el("span", { class: "who", text: "you" }), r.note);
      break;
    case "job":
      if (["finished", "stopped", "failed"].includes(r.status))
        node = el("div", { class: "ev say" }, el("span", { class: "t", text: time(r.ts) }), el("span", { class: "who", text: r.status }), r.message || "");
      break;
  }
  if (!node) return;
  if (isLive) node.classList.add("enter");
  feed.append(node);
  if (++S.feedCount > 2500) { feed.firstChild.remove(); S.feedCount--; }
}
function scrollFeed(force) {
  if (S.view !== "project" || S.tab === "files" || S.tab === "stats") return;
  const pane = $(`#pane-${S.tab}`);
  if (pane && (force || $("#f-follow").checked)) pane.scrollTop = pane.scrollHeight;
}
// Follow turns itself off when you scroll up to read, and back on when you
// scroll to the bottom, so new events never yank you away mid-read. (Our own
// auto-scrolls always land at the bottom, so position alone tells them apart.)
function watchScroll(pane) {
  pane.addEventListener("scroll", () => {
    const fromBottom = pane.scrollHeight - pane.scrollTop - pane.clientHeight;
    const box = $("#f-follow"); if (!box) return;
    if (fromBottom > 120 && box.checked) { box.checked = false; renderJump(); }
    else if (fromBottom < 30 && !box.checked) { box.checked = true; renderJump(); }
  }, { passive: true });
}

// ---------- live events ----------
let refreshTimer = null;
function scheduleRefresh(reloadProject) {
  clearTimeout(refreshTimer);
  refreshTimer = setTimeout(async () => {
    try {
      await refreshState();
      if (reloadProject && S.view === "project" && !S.dirty) { await loadProject(S.current); renderEditor(); renderProjectChrome(); }
    } catch (e) { /* transient */ }
  }, 250);
}
let filesTimer = null;
function scheduleFiles() {
  // The agent changed something: refresh the file list (or count it as unread).
  if (S.tab !== "files") { badge("#n-files", S.unreadFiles = (S.unreadFiles || 0) + 1); return; }
  clearTimeout(filesTimer); filesTimer = setTimeout(loadFiles, 1500);
}
async function pollEvents() {
  for (;;) {
    try {
      const { events, last } = await api("GET", `/api/events?after=${S.lastEvent}`);
      setOnline(true);
      let refresh = false, reload = false, files = false, stats = false;
      if (last < S.lastEvent) { S.lastEvent = 0; refresh = reload = true; }  // server restarted: our state is stale
      for (const ev of events) {
        S.lastEvent = Math.max(S.lastEvent, ev.id);
        if (S.view === "project" && ev.project === S.current) {
          if (ev.kind === "contract" && ev.renamed_to) { const to = ev.renamed_to; S.dirty = false; refresh = true;
            setTimeout(() => openProject(to, true), 0); continue; }
          if (ev.kind === "contract" && ev.deleted) { S.dirty = false; toast(`${ev.project} was deleted.`, "ok"); openWelcome(); refresh = true; continue; }
          if (ev.kind === "stream") { liveStream(ev); continue; }
          if (ev.kind === "context") { S.context = { tokens: ev.tokens, max: ev.max }; renderRunline(); if (S.tab === "stats" && S.stats) renderStats(); continue; }
          if (ev.kind === "chat") {
            addChat(ev, true);
            if (S.tab !== "chat") badge("#n-chat", ++S.unreadChat);
            if (ev.role === "tool_result" || ev.role === "check") files = true;
            renderLiveStatus();
          } else addFeed(ev, true);
        }
        if (["job", "planning", "contract", "turn", "milestone_start", "skip", "guidance", "review"].includes(ev.kind)) refresh = true;
        if (ev.kind === "job" && ev.status === "finished" && ev.project === S.current && S.view === "project") setTimeout(celebrate, 700);
        if (["job", "contract", "turn", "milestone_start", "skip", "guidance", "review"].includes(ev.kind) && ev.project === S.current) reload = true;
        if (["turn", "escalate", "guidance", "skip", "contract", "job", "review"].includes(ev.kind) && ev.project === S.current) stats = true;
      }
      if (events.length) scrollFeed(false);
      if (refresh) scheduleRefresh(reload);
      if (files) scheduleFiles();
      if (stats && S.tab === "stats") { clearTimeout(S.statsTimer); S.statsTimer = setTimeout(loadStats, 800); }
    } catch (e) {
      setOnline(false);
      await new Promise(r => setTimeout(r, 3000));
    }
  }
}
function setOnline(on) {
  if (on === S.online) return;
  S.online = on; $("#offline").classList.toggle("hidden", on);
  if (on) scheduleRefresh(true);  // catch up on whatever happened while we were away
}

// ---------- boot ----------
$("#newbtn").onclick = () => { document.body.classList.remove("menu-open"); openNew(); };
$("#ideasbtn").onclick = () => { document.body.classList.remove("menu-open"); if (S.view !== "ideas") openIdeas(); };
$("#menubtn").onclick = () => document.body.classList.toggle("menu-open");
$("main").addEventListener("click", () => document.body.classList.remove("menu-open"));
document.addEventListener("keydown", (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "s" && S.view === "project") {
    e.preventDefault(); if (S.dirty && !jobHere()) save();
  }
  if (e.key === "Escape") document.body.classList.remove("menu-open");
});
window.addEventListener("beforeunload", (e) => { if (S.dirty) { e.preventDefault(); e.returnValue = ""; } });
(async () => {
  drawLogo();
  try { await refreshState(); } catch (e) { toast(e.message); return; }
  S.lastEvent = S.state.last_event;
  const j = job();
  if (j && j.active) await openProject(j.project, true);
  else if (S.state.projects.length) openWelcome();
  else openNew();
  pollEvents();
})();
</script>
</body>
</html>
