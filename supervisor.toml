# All settings are optional; these are the defaults.

[ollama]
ollama_url = "http://192.168.50.95:11434"
model = "qwen-abl:latest"
# Must stay well below the model's context window (qwen-abl: 49152) so the
# model always has room to reply. OpenHands summarizes history to fit this.
max_input_tokens = 34000
max_output_tokens = 8000
temperature = 0.7
llm_timeout = 900
# Stream the agent's output token by token so the web UI shows it as it's
# written. Turn off if your Ollama version mishandles streaming with tools.
stream = true
# Rust/Python test guard: a passing check that ran 0 tests, or that passes
# because the agent skipped (#[ignore], pytest.skip...) or deleted tests,
# counts as failed. The final review also runs the full cargo test / pytest
# suite, Python in a clean virtualenv with only the declared dependencies.
test_guard = true
# Ideas chat (brainstorming, separate from projects): may it read public web
# pages? And chat_think = false makes thinking models answer faster there.
chat_web = true
# chat_think = false
# Watch the streamed reply and cut it off if the model starts repeating itself
# mid-generation (a "thinking loop"); the milestone then restarts fresh.
loop_guard = true
# Sampling settings that make reasoning models (e.g. Qwen) loop less. Leave
# them commented out for Ollama's defaults. Qwen's advice for thinking mode:
# top_p = 0.95
# top_k = 20
# presence_penalty = 1.5   # 0 = off; higher = less repetition (can hurt code a little)

[agent]
server_image = "ghcr.io/openhands/agent-server:latest-python"
iterations_per_turn = 40   # tool calls before the supervisor checks in
setup_timeout = 1800
check_timeout = 900
# Final review, after the last milestone: re-run every milestone's check, then
# have the model write one end-to-end test command per requirement in the goal
# and run them. Failures become new milestones. review_rounds caps how many
# times that repeats; 0 = review and report only, add no milestones.
final_review = true
review_rounds = 2

[limits]
max_turns_per_conversation = 8
max_restarts_per_milestone = 3   # then it asks you
max_consecutive_errors = 3
max_questions_per_milestone = 4
stagnant_turns = 3               # same check failure this many turns -> restart
repeat_actions = 4               # actions repeating earlier ones with same result -> warn, then ask you
stall_turns = 4                  # turns with no file change and same check result -> ask you
stall_tokens = 400000            # tokens spent without progress -> ask you (0 = no limit)
check_output_chars = 2500
