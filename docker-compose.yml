# Quick start:
#   docker compose up --build -d
#   open http://<this-machine>:8765
#
# Code ends up in ./projects/<name>. Runs survive closing the browser tab.
#
# Without the web UI (goal from goal.md, unattended):
#   docker compose run --rm supervisor auto
# Interactive terminal mode:
#   docker compose run --rm supervisor run <project>

services:
  supervisor:
    build: .
    image: openhands-supervisor:latest
    command: ["web"]
    restart: unless-stopped
    # Host networking: the supervisor reaches the agent sandbox it starts on
    # localhost:<port>, and Ollama on your LAN. The web UI listens on the
    # host's port 8765 directly (change with WEB_PORT). Linux only.
    network_mode: host
    stdin_open: true
    tty: true
    environment:
      WEB_PORT: ${WEB_PORT:-8765}
      # Optional: require this token to use the web UI (the page asks once).
      WEB_TOKEN: ${WEB_TOKEN:-}
      # Used by `auto` mode only:
      PROJECT: ${PROJECT:-project}
      REVIEW_PLAN: ${REVIEW_PLAN:-0}
      ON_ESCALATE: ${ON_ESCALATE:-stop}
      GOAL_FILE: /config/goal.md
      SUPERVISOR_CONFIG: /config/supervisor.toml
    volumes:
      # Lets the supervisor start OpenHands agent-server sandbox containers
      # (siblings on the host; visible in `docker ps` while running).
      - /var/run/docker.sock:/var/run/docker.sock
      - ./projects:/projects
      # This folder, read-only: goal.md and supervisor.toml.
      - .:/config:ro
